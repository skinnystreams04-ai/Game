
    <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игры - Тир-лист</title>
    <link href="https://fonts.googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <style>

        /* ВЫПАДАЮЩЕЕ МЕНЮ ВИЗУАЛА */
        .visual-dropdown { position: relative; display: inline-block; }
        .visual-dropdown-content { display: none; position: absolute; left: 50%; transform: translateX(-50%); top: 100%; margin-top: 15px; background: rgba(14, 17, 13, 0.95); border: 1px solid var(--theme-panel-border, #283325); border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 2000; min-width: 150px; backdrop-filter: blur(10px); flex-direction: column; gap: 15px; }
        .visual-dropdown.show .visual-dropdown-content { display: flex; }
        .role-toggles { display: flex; gap: 15px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 0; }
        .role-toggle-btn { background: transparent; border: none; border-bottom: 2px solid rgba(107, 122, 98, 0.3); color: #6b7a62; padding: 4px 2px; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; outline: none; }
        .role-toggle-btn:hover { color: #c4d1b8; border-bottom-color: rgba(196, 209, 184, 0.5); }
        .role-toggle-btn.active.streamer { color: #cba6f7; border-bottom-color: #cba6f7; text-shadow: 0 0 8px rgba(203, 166, 247, 0.6); }
        .role-toggle-btn.active.me { color: #a6e3a1; border-bottom-color: #a6e3a1; text-shadow: 0 0 8px rgba(166, 227, 161, 0.6); }
        .role-toggle-btn.active.chat { color: #b8a87b; border-bottom-color: #b8a87b; text-shadow: 0 0 8px rgba(184, 168, 123, 0.6); }

        /* ГЛОБАЛЬНЫЕ ЦВЕТА */
        :root {
            --theme-primary: #a6e3a1;
            --theme-glow: rgba(166, 227, 161, 0.5);
            --theme-panel-border: #283325;
            --btn-color: #a6e3a1;
        }

        /* ГЛОБАЛЬНЫЙ ПЕРЕКЛЮЧАТЕЛЬ САЙТОВ (ЛОГОТИП) */
        .logo-dropdown { position: relative; display: inline-block; padding: 10px 0; }
        .nav-logo-wrap { display: flex; align-items: center; gap: 8px; color: var(--theme-primary, #a6e3a1); font-size: 24px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--theme-glow, rgba(166, 227, 161, 0.5)); cursor: pointer; transition: 0.3s; font-family: 'Neucha', cursive; }
        .nav-logo-wrap:hover { filter: brightness(1.2); }
        .logo-arrow { font-size: 14px; opacity: 0.7; transition: transform 0.3s; }
        .logo-dropdown:hover .logo-arrow { transform: rotate(180deg); }
        
        .logo-dropdown-content { display: none; position: absolute; left: 0; top: 100%; margin-top: -5px; background: rgba(14, 17, 13, 0.95); border: 1px solid var(--theme-panel-border, #283325); border-radius: 12px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 2000; min-width: 200px; backdrop-filter: blur(10px); flex-direction: column; gap: 5px; }
        .logo-dropdown:hover .logo-dropdown-content { display: flex; }
        
        .logo-link { color: #a4b09c; text-decoration: none; font-family: 'Neucha', cursive; font-size: 18px; font-weight: bold; text-transform: uppercase; padding: 10px 15px; border-radius: 8px; transition: 0.3s; text-align: left; display: flex; align-items: center; gap: 10px; border: 1px solid transparent; }
        .logo-link:hover { background: rgba(0,0,0,0.4); color: var(--site-color); text-shadow: 0 0 10px var(--site-color); border-color: var(--site-color); }
        .logo-link.active { color: var(--site-color); background: rgba(0,0,0,0.3); border-left: 3px solid var(--site-color); border-radius: 4px 8px 8px 4px; }

        body { margin: 0; font-family: 'Neucha', cursive; background: #0b0d0a; color: #a4b09c; min-height: 100vh; padding-bottom: 50px; }

        /* ШАПКА */
        .top-nav { background: #0b0d0a; border-bottom: 2px solid var(--theme-panel-border); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); position: relative; z-index: 1000; transition: border-color 0.5s ease; }
        
        /* Логотип теперь идеально совпадает с заголовком тир-листа */
        .nav-logo { color: var(--theme-primary); font-size: 24px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-decoration: none; text-shadow: 0 0 10px var(--theme-glow); transition: color 0.5s ease, text-shadow 0.5s ease; cursor: pointer; }
        .nav-logo:hover { filter: brightness(1.2); }
        
        .nav-btn { background: transparent; border: none; color: #a4b09c; padding: 5px 0; font-family: inherit; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; position: relative; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; outline: none; }
        .nav-btn::after { content: ''; position: absolute; width: 0; height: 2px; bottom: 0; left: 50%; background-color: var(--btn-color, #a6e3a1); transition: 0.3s; transform: translateX(-50%); box-shadow: 0 0 8px var(--btn-color, #a6e3a1); }
        .nav-btn:hover { color: var(--btn-color, #a6e3a1); text-shadow: 0 0 10px var(--btn-color, #a6e3a1); }
        .nav-btn:hover::after { width: 100%; }
        
        /* ПОСТОЯННОЕ ПОДЧЕРКИВАНИЕ ДЛЯ АКТИВНОЙ КНОПКИ */
        .nav-btn.active::after { width: 100%; }

        .btn-hub:hover { --btn-color: #ffd700; color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .btn-visual:hover { --btn-color: #a6e3a1; color: #a6e3a1; text-shadow: 0 0 10px rgba(166, 227, 161, 0.5); }

        .nav-auth .twitch-btn { background: #6441a5; color: white; padding: 8px 16px; border-radius: 8px; font-family: inherit; font-size: 18px; font-weight: bold; cursor: pointer; border: 1px solid #4a307a; transition: 0.2s; letter-spacing: 1px;}
        .nav-auth .twitch-btn:hover { background: #7d5bbe; box-shadow: 0 0 15px rgba(100, 65, 165, 0.8); }

        /* ОСНОВА ТИР-ЛИСТА */
        .tier-board { position: relative; margin: 20px 40px; display: flex; flex-direction: column; background: #0b0d0a; border: 1px solid var(--theme-panel-border); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden; transition: border-color 0.5s ease; }
        .board-header { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 20px 30px; background: rgba(14, 17, 13, 0.8); border-bottom: 1px solid var(--theme-panel-border); transition: border-color 0.5s ease; }
        
        /* ЗАГОЛОВОК (Жестко задали красивый шрифт и увеличили размер) */
        .board-title { font-family: 'Neucha', cursive; color: var(--theme-primary); font-size: 28px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--theme-glow); transition: color 0.5s ease, text-shadow 0.5s ease; }
        
        #tier-content-area { position: relative; z-index: 2; }
        .tier-row { display: flex; background: rgba(0,0,0,0.2); border-bottom: 1px solid #1a2217; min-height: 140px; transition: background 0.3s, box-shadow 0.3s; }
        .tier-row:last-child { border-bottom: none; }
        
        .tier-label { width: 100px; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: bold; flex-shrink: 0; box-shadow: 5px 0 15px rgba(0,0,0,0.5); z-index: 2; transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .tier-content { display: flex; flex-wrap: wrap; gap: 12px; padding: 15px; flex: 1; align-content: flex-start; min-height: 120px; transition: 0.3s; }
        
        /* БЭКЛОГ */
        .backlog-container { margin: 20px 40px; background: rgba(14, 17, 13, 0.5); border: 1px dashed var(--theme-panel-border); border-radius: 12px; padding: 25px 15px 15px 15px; min-height: 130px; position: relative; transition: border-color 0.5s ease; display: flex; flex-wrap: wrap; gap: 12px; align-content: flex-start; z-index: 2; }
        .backlog-title { position: absolute; top: -12px; left: 30px; background: #0b0d0a; padding: 0 15px; color: var(--theme-primary); font-size: 16px; font-weight: bold; text-transform: uppercase; border: 1px solid var(--theme-panel-border); border-radius: 6px; letter-spacing: 1px; transition: color 0.5s ease, border-color 0.5s ease; }

        /* КАРТОЧКА ИГРЫ */
        .tier-item { width: 120px; height: 180px; border-radius: 6px; cursor: grab; position: relative; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.5); background-size: cover; background-position: center; transition: all 0.2s ease-out; border: 2px solid transparent; }
        .tier-item:hover { transform: scale(1.1) translateY(-5px); z-index: 10; box-shadow: 0 10px 20px rgba(0,0,0,0.8), 0 0 15px var(--theme-light, rgba(255,255,255,0.1)); border-color: var(--theme-light, rgba(255,255,255,0.3)); }
        .tier-item:active { cursor: grabbing; transform: scale(1.05); opacity: 0.9; z-index: 20; box-shadow: 0 0 20px var(--theme-light, #a6e3a1); border-color: var(--theme-light, #a6e3a1); }
        .tier-item.dragging { opacity: 0.5 !important; transform: scale(1.05); z-index: 99; pointer-events: none; }

        .drag-over { background: rgba(255, 255, 255, 0.03); box-shadow: inset 0 0 30px rgba(0,0,0,0.8); }
        .drag-over .tier-label { filter: brightness(1.3); transform: scale(1.05); }
        .backlog-container.drag-over { border-color: #a6e3a1; background: rgba(166, 227, 161, 0.05); }

        .front-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 30px 6px 6px 6px; box-sizing: border-box; background: linear-gradient(0deg, rgba(11,13,10,1) 0%, rgba(11,13,10,0.8) 50%, transparent 100%); display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }
        .game-title { color: var(--theme-light, #e4e4e4); font-size: 15px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; text-align: center; text-shadow: 2px 2px 4px #000, 0 0 10px rgba(0,0,0,0.8); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.1; transition: color 0.3s; }

        /* ДИНАМИЧЕСКИЙ ФОН ВНУТРИ ОКНА */
        #dynamic-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; filter: blur(40px); opacity: 0; z-index: 0; pointer-events: none; transition: opacity 0.5s ease, background-image 0.5s ease; }
        #dynamic-bg.active { opacity: 0.15; }
        /* Плавное перетекание цветов Хамелеона для всей страницы */
        .top-nav, .nav-logo, .board-title, .tier-board, .board-header {
            transition: color 0.5s ease, text-shadow 0.5s ease, border-color 0.5s ease !important;
        }

        /* ПРОФИЛЬ TWITCH В ШАПКЕ */
        .user-profile-neon { display: flex; align-items: center; gap: 18px; background: rgba(15, 20, 15, 0.2); backdrop-filter: blur(16px); padding: 10px 25px 10px 10px; border-radius: 12px; border: 1px solid var(--theme-panel-border, rgba(166, 227, 161, 0.15)); box-shadow: 0 8px 32px rgba(0,0,0,0.5); transition: 0.5s; }
        .user-profile-neon:hover { background: rgba(15, 20, 15, 0.3); border-color: rgba(166, 227, 161, 0.3); box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 15px rgba(166, 227, 161, 0.1); }
        .avatar-glow-wrap { position: relative; display: flex; justify-content: center; align-items: center; }
        .avatar-glow-wrap::before { content: ''; position: absolute; width: 120%; height: 120%; border-radius: 50%; background: var(--user-color, #a6e3a1); filter: blur(10px); opacity: 0.3; transition: 0.3s; }
        .user-profile-neon:hover .avatar-glow-wrap::before { opacity: 0.6; }
        .user-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--user-color, #a6e3a1); position: relative; z-index: 2; object-fit: cover; }
        .profile-info { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
        .profile-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .profile-name-top { font-family: 'Neucha', cursive; font-size: 16px; font-weight: bold; letter-spacing: 1px; line-height: 1; }
        .profile-bottom { display: flex; align-items: center; gap: 15px; }
        .wallet-item { display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: bold; line-height: 1; text-shadow: 1px 1px 2px #000; }
        .wallet-item img { width: 18px; height: 18px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
        .logout-neon { background: transparent; border: none; color: rgba(255, 85, 85, 0.6); font-family: 'Neucha', cursive; font-size: 15px; text-transform: uppercase; font-weight: bold; cursor: pointer; transition: 0.3s; padding: 0; line-height: 1;}
        .logout-neon:hover { color: #ff5555; text-shadow: 0 0 12px rgba(255, 85, 85, 0.8); transform: scale(1.05); }
        .role-badge { display: inline-flex; align-items: center; justify-content: center; padding: 2px 10px; border-radius: 6px; font-size: 13px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .role-sub { background: #6441a5; color: #fff; border: 1px solid #4a307a; } 
        .role-vip { background: #e05e85; color: #fff; border: 1px solid #b83d63; }
        .role-f { background: #333333; color: #a4b09c; border: 1px solid #222; }

    </style>
</head>

    <!-- ЛОГИКА ПЕРЕТАСКИВАНИЯ -->
    <script>

        const TWITCH_CLIENT_ID = 'gko3y2nhxg0ocvte0ru970pbau3eiq';
        const REDIRECT_URI = 'https://skinnystreams04-ai.github.io/Game/index.html'; 
        const FIREBASE_BASE = 'https://skinwalkerauction-default-rtdb.europe-west1.firebasedatabase.app';
        let currentUser = null;
        window.globalUsersDB = {};

        function loginTwitch() { window.location.href = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=`; }
        function logoutTwitch() { try { localStorage.removeItem('twitch_token'); } catch(e){} location.reload(); }

        function getUserInfo(username, fallbackTwitchColor) {
            const lowerName = username.toLowerCase();
            const dbUser = window.globalUsersDB[lowerName]; 
            let r = "F"; let g = 0; let t = 0; let c = fallbackTwitchColor || '#a4b09c';
            if (dbUser) {
                if (dbUser.role) r = dbUser.role.toUpperCase();
                if (dbUser.wallet_gold) g = dbUser.wallet_gold;
                if (dbUser.wallet_tickets) t = dbUser.wallet_tickets;
                if (dbUser.color && dbUser.color.trim() !== "") c = dbUser.color;
            }
            let badgeHtml = `<span class="role-badge role-f">FOLLOW</span>`;
            if (r === 'SUB' || r === 'SUBSCRIBER') badgeHtml = `<span class="role-badge role-sub">SUB</span>`;
            else if (r === 'VIP') badgeHtml = `<span class="role-badge role-vip">VIP</span>`;
            return { role: r, gold: g, tickets: t, color: c, badge: badgeHtml };
        }

        async function checkTwitchAuth() {
            try {
                // Подгружаем глобальную базу для билетов и бейджей
                try {
                    const dbRes = await fetch(`${FIREBASE_BASE}/global_users.json`, { cache: 'no-store' });
                    if (dbRes.ok) window.globalUsersDB = (await dbRes.json()) || {};
                } catch(e) {}

                const hash = window.location.hash;
                let token = null;
                try { token = localStorage.getItem('twitch_token'); } catch(e){}

                if (hash && hash.includes('access_token')) {
                    token = new URLSearchParams(hash.substring(1)).get('access_token');
                    try { localStorage.setItem('twitch_token', token); } catch(e){}
                    window.history.replaceState(null, null, window.location.pathname + window.location.search); 
                }

                if (token) {
                    const res = await fetch('https://api.twitch.tv/helix/users', { headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${token}` } });
                    if (res.status === 401) { try { localStorage.removeItem('twitch_token'); } catch(e){} return; }
                    currentUser = (await res.json()).data[0];

                    try {
                        const colorRes = await fetch(`https://api.twitch.tv/helix/chat/color?user_id=${currentUser.id}`, { headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${token}` } });
                        const colorData = await colorRes.json();
                        currentUser.color = (colorData.data && colorData.data[0] && colorData.data[0].color) ? colorData.data[0].color : null;
                    } catch(e) {}
                    
                    const uInfo = getUserInfo(currentUser.login, currentUser.color);
                    
                    document.getElementById('nav-auth').innerHTML = `
                        <div class="user-profile-neon">
                            <div class="avatar-glow-wrap" style="--user-color: ${uInfo.color}; cursor: pointer; transition: 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'" onclick="window.location.href='profile.html?user=${currentUser.id}'" title="Мой профиль">
                                <img src="${currentUser.profile_image_url}" class="user-avatar">
                            </div>
                            <div class="profile-info">
                                <div class="profile-top">
                                    <span class="profile-name-top" style="color: ${uInfo.color}; text-shadow: 0 0 8px ${uInfo.color}; cursor: pointer; transition: 0.2s;" onmouseover="this.style.filter='brightness(1.3)'" onmouseout="this.style.filter='none'" onclick="window.location.href='profile.html?user=${currentUser.id}'" title="Мой профиль">${currentUser.display_name}</span>
                                    <button class="logout-neon" onclick="logoutTwitch()">Выйти</button>
                                </div>
                                <div class="profile-bottom">
                                    ${uInfo.badge}
                                    <div class="wallet-item" style="color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);">
                                        <img src="icons/BILET_GOLD.png"> <span>${uInfo.gold}</span>
                                    </div>
                                    <div class="wallet-item" style="color: #a6e3a1; text-shadow: 0 0 10px rgba(166, 227, 161, 0.3);">
                                        <img src="icons/BILET.png"> <span>${uInfo.tickets}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            } catch (e) { console.error('Ошибка авторизации', e); }
        }

        // --- ЛОГИКА МЕНЮ ВИЗУАЛА ---
        let visRoles = JSON.parse(localStorage.getItem('skinwalker_games_roles')) || { streamer: true, me: true, chat: true };

        function toggleVisualMenu() { 
            document.getElementById('visual-dropdown').classList.toggle('show'); 
        }
        
        window.addEventListener('click', function(e) {
            if (!document.getElementById('visual-dropdown').contains(e.target)) {
                document.getElementById('visual-dropdown').classList.remove('show');
            }
        });

        function toggleRoleVis(role) {
            visRoles[role] = !visRoles[role];
            localStorage.setItem('skinwalker_games_roles', JSON.stringify(visRoles)); // Синхронизируем с Хабом
            document.getElementById(`toggle-${role}`).classList.toggle('active', visRoles[role]);
            
            // Если позже добавим цифры на карточки тир-листа, тут нужно будет вызывать перерисовку:
            // loadTierList(); 
        }

        // При загрузке страницы восстанавливаем нажатые кнопки из памяти
        window.addEventListener('DOMContentLoaded', () => {
            Object.keys(visRoles).forEach(role => {
                const btn = document.getElementById(`toggle-${role}`);
                if (btn) btn.classList.toggle('active', visRoles[role]);
            });
        });

        const FIREBASE_DB_URL = "https://skinwalkerauction-default-rtdb.europe-west1.firebasedatabase.app/games_db.json";
        let gamesData = {};

        // Цвета для горизонтальных линий тиров
        const tierColors = { 'S': '255, 74, 74', 'A': '255, 215, 0', 'B': '203, 166, 247', 'C': '137, 180, 250', 'D': '166, 227, 161', 'F': '136, 136, 136' };

        // --- 1. ЗАГРУЗКА И ОТРИСОВКА ---
        async function loadTierList() {
            try {
                const res = await fetch(FIREBASE_DB_URL);
                gamesData = await res.json() || {};
                
                document.querySelectorAll('.tier-content').forEach(el => el.innerHTML = '');
                const backlog = document.querySelector('.backlog-container');
                backlog.innerHTML = '<div class="backlog-title">Бэклог / Без оценки</div>';

                // Красим горизонтальные линии под каждым тиром с отступом 100px
                document.querySelectorAll('.tier-row').forEach(row => {
                    const tier = row.getAttribute('data-tier');
                    const rgb = tierColors[tier];
                    if (rgb) {
                        row.style.background = `linear-gradient(90deg, rgba(0,0,0,0.2) 0px, rgba(0,0,0,0.2) 100px, rgba(${rgb}, 0.12) 100px, rgba(0,0,0,0.2) 600px)`;
                        row.style.borderBottom = `1px solid rgba(${rgb}, 0.3)`; 
                    }
                });

                const gamesArray = Object.entries(gamesData).map(([id, data]) => ({ id, ...data }));
                gamesArray.sort((a, b) => (a.scores?.position || 999) - (b.scores?.position || 999));

                gamesArray.forEach(game => {
                    const tier = game.scores?.tier || 'UNRANKED';
                    
                    const card = document.createElement('div');
                    card.className = 'tier-item';
                    card.draggable = true;
                    card.id = game.id;
                    card.title = game.title;
                    card.style.backgroundImage = `url('${game.coverUrl}')`;
                    card.setAttribute('data-cover', game.coverUrl); 
                    
                    // Железобетонная привязка событий перетаскивания прямо к карточке
                    card.addEventListener('dragstart', drag);
                    card.addEventListener('dragend', dragEnd);
                    
                    // Умный клик: переходим на страницу игры, только если это не перетаскивание
                    card.addEventListener('click', (e) => {
                        if (window.isDraggingCard) {
                            e.preventDefault();
                            return; 
                        }
                        window.location.href = `games-page.html?id=${encodeURIComponent(game.id).replace(/'/g, "%27")}`;
                    });
                    
                    // --- ДИНАМИЧЕСКИЙ ФОН И ПЕРЕКРАСКА (ХАМЕЛЕОН) ---
                    card.addEventListener('mouseenter', () => {
                        if (window.isDraggingCard) return; 
                        
                        const bg = document.getElementById('dynamic-bg');
                        bg.style.backgroundImage = `url('${game.coverUrl}')`;
                        bg.classList.add('active');

                        if (card.dataset.rgb) {
                            const rgb = card.dataset.rgb;
                            document.documentElement.style.setProperty('--theme-primary', `rgb(${rgb})`);
                            document.documentElement.style.setProperty('--theme-glow', `rgba(${rgb}, 0.5)`);
                            document.documentElement.style.setProperty('--theme-panel-border', `rgba(${rgb}, 0.4)`);
                            
                            // Красим логотип
                            document.documentElement.style.setProperty('--theme-logo', `rgb(${rgb})`);
                            document.documentElement.style.setProperty('--theme-logo-glow', `rgba(${rgb}, 0.5)`);
                        }
                    });
                    
                    card.addEventListener('mouseleave', () => {
                        document.getElementById('dynamic-bg').classList.remove('active');
                        
                        document.documentElement.style.removeProperty('--theme-primary');
                        document.documentElement.style.removeProperty('--theme-glow');
                        document.documentElement.style.removeProperty('--theme-panel-border');
                        
                        // Возвращаем логотипу родной цвет
                        document.documentElement.style.removeProperty('--theme-logo');
                        document.documentElement.style.removeProperty('--theme-logo-glow');
                    });
                    
                    card.innerHTML = `
                        <div class="front-overlay">
                            <div class="game-title">${game.title}</div>
                        </div>
                    `;

                    if (tier === 'UNRANKED') {
                        backlog.appendChild(card);
                    } else {
                        const targetRow = document.querySelector(`.tier-row[data-tier="${tier}"] .tier-content`);
                        if (targetRow) targetRow.appendChild(card);
                    }
                });

                extractCoverColors();

            } catch (e) { console.error("Ошибка загрузки базы:", e); }
        }

        // Красим названия в цвета обложек + Умный обход блокировок (CORS Proxy)
        function extractCoverColors() {
            if (typeof ColorThief === 'undefined') return;
            const colorThief = new ColorThief();
            
            document.querySelectorAll('.tier-item').forEach(card => {
                const imgUrl = card.getAttribute('data-cover');
                if (!imgUrl) return;

                const processColor = (imgEl) => {
                    try {
                        const color = colorThief.getColor(imgEl);
                        let r = color[0], g = color[1], b = color[2];
                        const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
                        if (luminance < 90) { r = Math.min(255, r + 80); g = Math.min(255, g + 80); b = Math.min(255, b + 80); }
                        
                        card.style.setProperty('--theme-light', `rgb(${r}, ${g}, ${b})`); 
                        card.dataset.rgb = `${r}, ${g}, ${b}`;
                    } catch(e) { applyFallback(); }
                };
                
                const applyFallback = () => {
                    card.style.setProperty('--theme-light', `rgb(166, 227, 161)`);
                    card.dataset.rgb = `166, 227, 161`; 
                };

                const hiddenImg = new Image();
                hiddenImg.crossOrigin = 'Anonymous';
                
                hiddenImg.onload = () => processColor(hiddenImg);
                
                // Пробуем обойти блокировку, если прямая ссылка не отдает цвет
                hiddenImg.onerror = function() {
                    const proxyImg = new Image(); 
                    proxyImg.crossOrigin = 'Anonymous';
                    proxyImg.onload = () => processColor(proxyImg);
                    proxyImg.onerror = function() {
                        const proxyImg2 = new Image(); 
                        proxyImg2.crossOrigin = 'Anonymous';
                        proxyImg2.onload = () => processColor(proxyImg2);
                        proxyImg2.onerror = applyFallback; 
                        proxyImg2.src = 'https://wsrv.nl/?url=' + encodeURIComponent(imgUrl);
                    };
                    proxyImg.src = 'https://corsproxy.io/?' + encodeURIComponent(imgUrl);
                };
                
                hiddenImg.src = imgUrl + '?bypassCache=' + Date.now();
            });
        }

        window.onload = () => {
            checkTwitchAuth(); // Сначала проверяем Twitch и рисуем профиль
            loadTierList();    // Параллельно грузим карточки тир-листа
        };

        // --- 2. МАССОВОЕ СОХРАНЕНИЕ ПОРЯДКА В БАЗУ ---
        async function updateTierOrder() {
            const updates = {};
            document.querySelectorAll('.tier-row').forEach(row => {
                const tier = row.getAttribute('data-tier');
                row.querySelectorAll('.tier-item').forEach((card, index) => {
                    updates[`${card.id}/scores/tier`] = tier;
                    updates[`${card.id}/scores/position`] = index + 1;
                });
            });
            document.querySelectorAll('.backlog-container .tier-item').forEach(card => {
                updates[`${card.id}/scores/tier`] = 'UNRANKED';
                updates[`${card.id}/scores/position`] = 0;
            });

            try {
                await fetch(FIREBASE_DB_URL, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updates) });
                console.log("Порядок успешно сохранен в базу!");
            } catch(e) { console.error("Ошибка сохранения:", e); }
        }

        // Глобальный флаг, который отличает клик от перетаскивания
        window.isDraggingCard = false;

        // --- 3. УМНАЯ ФИЗИКА ПЕРЕТАСКИВАНИЯ (С УЧЕТОМ СТРОК) ---
        function drag(ev) {
            window.isDraggingCard = true; // Включаем предохранитель: мы начали тащить!
            
            const card = ev.target.closest('.tier-item');
            if (!card) return;
            
            ev.dataTransfer.setData("text", card.id);
            ev.dataTransfer.effectAllowed = "move";
            
            setTimeout(() => { card.classList.add('dragging'); }, 0);
        }

        function dragEnd(ev) {
            const card = ev.target.closest('.tier-item');
            if (card) card.classList.remove('dragging');
            
            document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            updateTierOrder(); 
            
            // Выключаем предохранитель с микро-задержкой, чтобы ложный клик при отпускании мышки не сработал
            setTimeout(() => { window.isDraggingCard = false; }, 100);
        }

        function allowDrop(ev) {
            ev.preventDefault();
            let dropzone = ev.target.closest('.tier-row, .backlog-container');
            
            if (dropzone) {
                dropzone.classList.add('drag-over');
                let targetZone = dropzone.classList.contains('backlog-container') ? dropzone : dropzone.querySelector('.tier-content');
                
                // Передаем X и Y для расчета правильного места
                const afterElement = getDragAfterElement(targetZone, ev.clientX, ev.clientY);
                const draggable = document.querySelector('.dragging');
                
                if (draggable) {
                    if (afterElement == null) targetZone.appendChild(draggable);
                    else targetZone.insertBefore(draggable, afterElement);
                }
            }
        }

        function getDragAfterElement(container, x, y) {
            const draggableElements = [...container.querySelectorAll('.tier-item:not(.dragging)')];
            
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                
                // 1. Проверяем, на одной ли мы строке с карточкой по Y (даем запас 15px)
                const inRow = y >= box.top - 15 && y <= box.bottom + 15;
                if (!inRow) return closest; 
                
                // 2. Если мы на нужной строке, проверяем лево/право по X
                const offset = x - (box.left + box.width / 2);
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function dragEnter(ev) { ev.preventDefault(); }
        function dragLeave(ev) {
            let dropzone = ev.target.closest('.tier-row, .backlog-container');
            if (dropzone && !dropzone.contains(ev.relatedTarget)) dropzone.classList.remove('drag-over');
        }
        function drop(ev) {
            ev.preventDefault();
            let dropRow = ev.target.closest('.tier-row, .backlog-container');
            if (dropRow) dropRow.classList.remove('drag-over');
        }
    </script>
</body>
